name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Na primeira vez, o projeto chega como ZereiMaisUm.zip: descompacta e salva no repositório.
      - name: Descompactar projeto (se houver zip)
        if: hashFiles('ZereiMaisUm.zip') != ''
        run: |
          unzip -q ZereiMaisUm.zip -d /tmp/zm
          rsync -a --exclude .git --exclude .github /tmp/zm/ZereiMaisUm/ ./
          git rm -q ZereiMaisUm.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descompacta o projeto Zerei Mais Um"
          git push

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Testes de regras de negócio
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ZereiMaisUm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Criar release com o APK (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
